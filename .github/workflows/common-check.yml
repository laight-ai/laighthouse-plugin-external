# 공통 레포(laighthouse-plugin-common)에서 가져온 사본과 스킬 폴더 사본이 원본과 맞는지 검사한다.
# 공통 레포는 공개 레포라 토큰 없이 받는다.
name: common-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: laight-ai/laighthouse-plugin-common
          path: _common
          fetch-depth: 0   # sync.py가 common.json의 태그를 읽는다
      - name: 공통 레포를 common.json의 태그로 맞춘다
        run: git -C _common checkout -q "$(python -c 'import json; print(json.load(open("common.json"))["version"])')"
      - name: 공통 레포 사본 검사
        run: python _common/sync.py --check
      - name: 스킬 폴더 사본·GPT판 사본 검사
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_bundle_skills.py
