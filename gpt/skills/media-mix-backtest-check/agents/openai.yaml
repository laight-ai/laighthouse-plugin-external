interface:
  display_name: "예산안 백테스트 점검"
  short_description: "과거 달의 예산안을 그때 데이터로 다시 계산해 매체별 배분이 상식적으로 말이 되는지 점검합니다(성과 검증 아님)."
  brand_color: "#3F8F73"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "list_media_mix_metrics"
      description: "예산안에 쓸 비용·성과 지표 후보를 조회합니다."
    - type: "mcp"
      value: "get_ad_performance"
      description: "매체별 월 실적을 조회합니다(총예산과 판정 근거)."
    - type: "mcp"
      value: "list_media_mix_jobs"
      description: "이미 계산한 백테스트 결과가 있는지 확인합니다."
    - type: "mcp"
      value: "create_media_mix_job"
      description: "확인받은 대상 달마다 백테스트 예산안 계산을 시작합니다(backtest true)."
    - type: "mcp"
      value: "get_media_mix_job"
      description: "백테스트 예산안 결과(summary)를 조회합니다."
