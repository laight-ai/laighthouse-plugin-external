interface:
  display_name: "날씨 영향"
  short_description: "불쾌지수·기온·강수량이 광고 성과에 영향을 주었는지 일자별로 살펴봅니다."
  brand_color: "#4A7FB5"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "get_external_context"
      description: "네이버 검색량·뉴스·블로그·날씨 원본 데이터를 조회합니다."
    - type: "mcp"
      value: "get_ad_performance"
      description: "브랜드 광고 성과 데이터(일/월/구간 합산, 차원별 그룹화)를 조회합니다."
    - type: "mcp"
      value: "get_brand_list"
      description: "접근 가능한 브랜드 목록을 조회합니다(브랜드명이 거절됐을 때만)."
